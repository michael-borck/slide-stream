# Shared release pipeline: michael-borck/app-hq/.github/workflows/tauri-release.yml
name: Release desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: michael-borck/app-hq/.github/workflows/tauri-release.yml@main
    with:
      product-name: Slide Stream
      project-path: desktop
      tauri-script: npx --yes @tauri-apps/cli@^2
      install-command: ''
      cache: ''
      preflight-command: ''
      updater: false
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

  stable-assets:
    needs: release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rename release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          rm -rf out && mkdir -p out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir out
          shopt -s nullglob
          for f in out/*aarch64*.dmg; do mv "$f" out/SlideStream-macos-apple-silicon.dmg; done
          for f in out/*x64*.dmg; do mv "$f" out/SlideStream-macos-intel.dmg; done
          for f in out/*.AppImage; do mv "$f" out/SlideStream-linux.AppImage; done
          for f in out/*.deb; do mv "$f" out/SlideStream-linux.deb; done
          for f in out/*.rpm; do mv "$f" out/SlideStream-linux.rpm; done
          for f in out/*setup.exe; do mv "$f" out/SlideStream-windows-setup.exe; done
          for f in out/*.msi; do mv "$f" out/SlideStream-windows.msi; done
          ls -la out
          gh release upload "$TAG" out/SlideStream-* --clobber --repo "$GITHUB_REPOSITORY"
