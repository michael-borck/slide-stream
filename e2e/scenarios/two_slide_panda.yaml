# Full pipeline, two slides: artwork, LLM narration and voice from your home
# config, and a lip-synced panda (wan-s2v via ComfyUI). Needs
# COMFYUI_BASE_URL (and COMFYUI_TOKEN if your server checks one). reuse_clip renders ONE head
# clip and loops it under both slides — a single GPU render for the run.
providers:
  avatar:
    provider: wan-s2v
    base_url: "${COMFYUI_BASE_URL}"
    api_key: "${COMFYUI_TOKEN}"
    source: panda
settings:
  avatar:
    reuse_clip: true
