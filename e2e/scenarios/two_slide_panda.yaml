# Full pipeline, two slides: SwarmUI artwork, LLM narration, speaches voice,
# and a lip-synced panda (wan-s2v via ComfyUI). reuse_clip renders ONE head
# clip and loops it under both slides — a single GPU render for the run.
providers:
  avatar:
    provider: wan-s2v
    base_url: https://comfyui.locopuente.org
    api_key: "${COMFYUI_TOKEN}"
    source: panda
settings:
  avatar:
    reuse_clip: true
